# Apache virtual host for the 1C-Bitrix site served from the repository root.
<VirtualHost *:80>
	ServerName localhost
	DocumentRoot /workspace

	DirectoryIndex index.php index.html

	<Directory /workspace>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted

		# Standard Bitrix human-readable URL (ЧПУ) routing.
		RewriteEngine On
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-l
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteCond %{REQUEST_FILENAME} !/bitrix/urlrewrite.php$
		RewriteRule ^(.*)$ /bitrix/urlrewrite.php [L]
	</Directory>

	# Deny direct web access to Bitrix service files, mirroring production.
	<FilesMatch "\.(settings\.php|settings_extra\.php)$">
		Require all denied
	</FilesMatch>

	ErrorLog ${APACHE_LOG_DIR}/bitrix-error.log
	CustomLog ${APACHE_LOG_DIR}/bitrix-access.log combined
</VirtualHost>
