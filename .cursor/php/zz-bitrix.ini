; PHP configuration tuned for 1C-Bitrix (Управление сайтом: Бизнес).
; Applied to both the CLI and Apache (mod_php) SAPIs by .cursor/install.sh.

; Bitrix templates and public pages use short open tags (<? ... ?>).
short_open_tag = On

; Bitrix core / Aspro.Max need generous limits for the admin area and updates.
memory_limit = 512M
max_execution_time = 60
max_input_vars = 10000
upload_max_filesize = 1024M
post_max_size = 1024M
default_socket_timeout = 60

; Russian storefront – default timezone.
date.timezone = Europe/Moscow

; UTF-8 site.
mbstring.internal_encoding = UTF-8

; OPcache (recommended by the Bitrix "Проверка системы" checker).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 100000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 3600
